version: '3.8'

services:
  # AI Gateway MCP 应用
  ai-gateway-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-gateway-mcp-app
    restart: unless-stopped
    environment:
      # Spring 配置
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-integration}
      # MySQL 连接配置
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_PORT=${MYSQL_PORT}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USERNAME=${MYSQL_USERNAME}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      # JVM 配置
      - JAVA_OPTS=${JAVA_OPTS:--Xms256m -Xmx512m -XX:+UseG1GC}
      - TZ=Asia/Shanghai
    ports:
      - "8080:8080"
    networks:
      - ai-gateway-network
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

networks:
  ai-gateway-network:
    driver: bridge
